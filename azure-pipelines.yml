trigger: none

pool:
  name: cicdpool

resources:
  pipelines:
  - pipeline: ci
    source: sweta8indore.monolithic_front_react
    trigger: none

stages:
- stage: CD
  displayName: 'Deploy React Application'

  jobs:
  - job: Deploy
    displayName: 'Deploy to Frontend VM'

    steps:

    # Download artifact from latest successful CI pipeline
    - download: ci
      artifact: react-build

    # Check SSH user and create deploy folder in that user's home
    - task: SSH@0
      displayName: 'Create Deploy Folder'
      inputs:
        sshEndpoint: 'frontend-sc-ssh'
        runOptions: 'inline'
        inline: |
          echo "Logged in user:"
          whoami

          echo "Home directory:"
          echo $HOME

          mkdir -p $HOME/deploy

          echo "Deploy directory:"
          ls -ld $HOME/deploy

        readyTimeout: '20000'

    # Copy ZIP to remote user's home/deploy directory
    - task: CopyFilesOverSSH@0
      displayName: 'Copy Artifact to VM'
      inputs:
        sshEndpoint: 'frontend-sc-ssh'
        sourceFolder: '$(Pipeline.Workspace)/ci/react-build'
        contents: '*.zip'
        targetFolder: 'deploy'
        readyTimeout: '20000'

    # Deploy application
    - task: SSH@0
      displayName: 'Deploy Application on Nginx'
      inputs:
        sshEndpoint: 'frontend-sc-ssh'
        runOptions: 'inline'
        inline: |
          sudo apt update
          sudo apt install nginx unzip -y

          sudo rm -rf /var/www/html/*

          sudo unzip -o $HOME/deploy/*.zip -d /var/www/html/

          sudo systemctl restart nginx
          sudo systemctl enable nginx

          rm -f $HOME/deploy/*.zip

        readyTimeout: '20000'