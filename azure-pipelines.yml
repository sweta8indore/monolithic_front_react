trigger: none

pool:
  name: cicdpool

resources:
  pipelines:
  - pipeline: ci
    source: sweta8indore.monolithic_front_react
    trigger: none

stages:
- stage: CD
  displayName: 'Deploy React Application'

  jobs:
  - job: Deploy
    displayName: 'Deploy to Frontend VM'

    steps:

    - download: ci
      artifact: react-build

    - task: SSH@0
      displayName: 'Create Deploy Folder'
      inputs:
        sshEndpoint: 'frontend-sc-ssh'
        runOptions: 'inline'
        inline: |
          echo "User:"
          whoami
          echo "Home:"
          echo $HOME
          mkdir -p $HOME/deploy
          rm -f $HOME/deploy/*.zip

    - task: CopyFilesOverSSH@0
      displayName: 'Copy Artifact to VM'
      inputs:
        sshEndpoint: 'frontend-sc-ssh'
        sourceFolder: '$(Pipeline.Workspace)/ci/react-build'
        contents: '*.zip'
        targetFolder: 'deploy'
        readyTimeout: '20000'

    - task: SSH@0
      displayName: 'Deploy Application on Nginx'
      inputs:
        sshEndpoint: 'frontend-sc-ssh'
        runOptions: 'inline'
        inline: |
          echo "===== ZIP ====="
          ls -lh $HOME/deploy

          sudo rm -rf /var/www/html/*

          sudo unzip -o $HOME/deploy/*.zip -d /var/www/html/

          echo "===== DEPLOYED FILES ====="
          sudo ls -la /var/www/html

          if [ ! -f /var/www/html/index.html ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          sudo systemctl restart nginx

          echo "Deployment successful"